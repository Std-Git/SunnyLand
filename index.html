<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    
    <!-- 1. 彻底禁止浏览器缩放、双击放大、iOS 安全区适配 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <title>SunnyLand</title>
    
    <!-- 2. PWA 核心配置 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    
    <!-- 3. iOS PWA 专属支持 -->
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SunnyLand">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <!-- 4. MIUI / UC 浏览器全屏模式专属标签（关键！） -->
    <!-- 让 MIUI 的浏览器以全屏应用模式打开，不显示地址栏和导航栏 -->
    <meta name="full-screen" content="yes">
    <meta name="browsermode" content="application">
    <meta name="x5-fullscreen" content="true">
    <meta name="x5-page-mode" content="app">
    <!-- UC 浏览器全屏模式 -->
    <meta name="uc-full-screen" content="true">
    <meta name="uc-browser-mode" content="NORANDOM-WEBVIEW">
    
    <!-- 【关键修复】提前拦截 AudioContext，在 Emscripten 加载之前 -->
    <script>
        let currentAudioContext = null;
        (function() {
            var OriginalAudioContext = window.AudioContext || window.webkitAudioContext;
            if (!OriginalAudioContext) return;
            
            function PatchedAudioContext() {
                currentAudioContext = new OriginalAudioContext();
                return currentAudioContext;
            }
            
            for (var key in OriginalAudioContext) {
                if (OriginalAudioContext.hasOwnProperty(key)) {
                    PatchedAudioContext[key] = OriginalAudioContext[key];
                }
            }
            PatchedAudioContext.prototype = OriginalAudioContext.prototype;
            PatchedAudioContext.prototype.constructor = PatchedAudioContext;
            
            window.AudioContext = PatchedAudioContext;
            if (window.webkitAudioContext) {
                window.webkitAudioContext = PatchedAudioContext;
            }
        })();
    </script>
    
    <style>
        /* 全局重置 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #000;
            display: flex; justify-content: center; align-items: center;
            
            /* 
             * 【关键修复】MIUI 上 touch-action: manipulation 仍有 300ms 延迟
             * 改为 touch-action: none 彻底禁止所有触摸手势
             * 用 JS 精确控制触摸行为，避免浏览器猜测用户意图
             */
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            overscroll-behavior: none;
            /* 禁止 MIUI 的长按菜单和选中文本 */
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Canvas 样式 - 不触发 GPU 合成层 */
        canvas.emscripten {
            display: block;
            background: #000;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            touch-action: none;
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }

        /* 加载遮罩层样式 */
        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .loading-text {
            color: #fff; font-family: 'Courier New', monospace; font-size: 14px; 
            margin-bottom: 12px; opacity: 0.8; letter-spacing: 1px;
        }
        .progress-bar-container {
            width: 200px; height: 4px;
            background: #333; border-radius: 2px; overflow: hidden;
        }
        .progress-bar-fill {
            width: 0%; height: 100%;
            background: #fff;
            transition: width 0.2s ease;
        }
        .fade-out { opacity: 0; pointer-events: none; }
        
        /* PWA 安装引导弹窗 */
        #pwa-install-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 10000;
            justify-content: center; align-items: center; flex-direction: column;
            backdrop-filter: blur(4px);
        }
        
        /* 非独立模式提示弹窗 */
        #standalone-notice {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 10001;
            justify-content: center; align-items: center; flex-direction: column;
            padding: 20px;
        }
        #standalone-notice .notice-box {
            background: #1a1a2e; border: 2px solid #4a4a8a; border-radius: 16px;
            padding: 30px; max-width: 360px; text-align: center;
            box-shadow: 0 0 30px rgba(74,74,138,0.3);
        }
        #standalone-notice h2 {
            color: #fff; font-family: sans-serif; margin: 0 0 15px; font-size: 20px;
        }
        #standalone-notice p {
            color: #aaa; font-family: sans-serif; font-size: 14px; margin: 0 0 10px; 
            line-height: 1.6; text-align: left;
        }
        #standalone-notice ol {
            color: #ccc; font-family: sans-serif; font-size: 13px; margin: 10px 0 20px; 
            padding-left: 20px; text-align: left; line-height: 1.8;
        }
        #standalone-notice button {
            width: 100%; padding: 14px; border: none; border-radius: 8px;
            background: #4a4a8a; color: #fff; font-size: 16px; font-weight: bold;
            cursor: pointer; margin-top: 10px;
        }
        #standalone-notice button:active {
            background: #6a6aaa;
        }
    </style>
</head>
<body>

    <!-- 加载遮罩 -->
    <div id="loading-overlay">
        <div class="loading-text">LOADING ASSETS...</div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
    </div>

    <!-- 非独立模式提示 -->
    <div id="standalone-notice">
        <div class="notice-box">
            <h2>请安装为独立应用</h2>
            <p>当前页面在浏览器标签页中运行，触摸响应可能较慢。为获得最佳游戏体验，请安装为独立应用：</p>
            <ol>
                <li>点击浏览器右上角 <strong>⋮</strong>（三个点）</li>
                <li>选择 <strong>"安装应用"</strong> 或 <strong>"添加到主屏幕"</strong></li>
                <li>点击桌面图标 <strong>SunnyLand</strong> 打开</li>
            </ol>
            <button id="standalone-ok-btn">我知道了</button>
        </div>
    </div>

    <!-- PWA 安装引导弹窗 (Android 专属) -->
    <div id="pwa-install-overlay" style="display:none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 10000; justify-content: center; align-items: center; flex-direction: column; backdrop-filter: blur(4px);">
        <div style="background: #222; border: 2px solid #fff; border-radius: 12px; padding: 30px; max-width: 320px; text-align: center; box-shadow: 0 0 20px rgba(0,0,0,0.5);">
            <div style="font-size: 40px; margin-bottom: 15px;"></div>
            <h2 style="color: #fff; font-family: sans-serif; margin: 0 0 10px; font-size: 20px;">
                安装 SunnyLand
            </h2>
            <p style="color: #aaa; font-family: sans-serif; font-size: 14px; margin: 0 0 25px; line-height: 1.5;">
                添加到桌面，获得原生 App 般的流畅体验，<br>告别浏览器手势卡顿！
            </p>
            <button id="pwa-install-btn" style="width: 100%; padding: 14px; border: none; border-radius: 8px; background: #fff; color: #000; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 10px; transition: transform 0.1s;" onmousedown="this.style.transform='scale(0.95)'" onmouseup="this.style.transform='scale(1)'">
                立即安装
            </button>
            <button id="pwa-dismiss-btn" style="width: 100%; padding: 10px; border: none; border-radius: 8px; background: transparent; color: #888; font-size: 14px; cursor: pointer;">
                以后再说
            </button>
        </div>
    </div>

    <!-- 游戏画布 -->
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()"></canvas>

    <script>
        // CDN 基础路径
        const CDN_BASE = 'https://cdn.jsdelivr.net/gh/Std-Git/SunnyLand@master/';
        
        // DOM 元素
        const overlay = document.getElementById('loading-overlay');
        const progressFill = document.getElementById('progress-fill');
        const standaloneNotice = document.getElementById('standalone-notice');
        const standaloneOkBtn = document.getElementById('standalone-ok-btn');

        // 游戏逻辑分辨率（GPU 实际渲染尺寸）
        const GAME_WIDTH = 640;
        const GAME_HEIGHT = 360;

        // === 【关键修复】PWA 独立模式检测 ===
        // 检测当前是否在独立模式下运行（PWA 已安装并独立打开）
        function isInStandaloneMode() {
            return (
                window.matchMedia('(display-mode: standalone)').matches ||
                window.navigator.standalone === true ||
                document.referrer.includes('android-app://')
            );
        }

        // 如果不在独立模式下，显示安装引导
        if (!isInStandaloneMode()) {
            // 延迟显示，让用户先看到加载页面
            setTimeout(function() {
                standaloneNotice.style.display = 'flex';
            }, 2000);
        }

        standaloneOkBtn.addEventListener('click', function() {
            standaloneNotice.style.display = 'none';
        });

        var Module = {
            preRun: [],
            postRun: [],
            
            locateFile: function(filename) {
                return CDN_BASE + filename;
            },

            print: function(e) { 
                if (arguments.length > 1) e = Array.prototype.slice.call(arguments).join(" "); 
                console.log(e); 
            },
            printErr: function(e) { 
                if (arguments.length > 1) e = Array.prototype.slice.call(arguments).join(" "); 
                console.error(e); 
            },

            canvas: (function() {
                var canvas = document.getElementById('canvas');
                canvas.addEventListener('contextmenu', function(e) { e.preventDefault(); }, false);
                canvas.addEventListener('webglcontextlost', function(e) {
                    alert('WebGL context lost. Please reload.');
                    e.preventDefault();
                }, false);
                // MIUI 上 touchend 可能被丢失，用 touchcancel + mouseup 作为兜底
                canvas.addEventListener('touchcancel', function(e) {
                    // 让浏览器执行默认的 touchcancel 行为（释放触摸状态）
                }, false);
                canvas.addEventListener('mouseup', function(e) {
                    // 兜底释放：确保鼠标抬起时游戏能收到释放事件
                }, false);
                return canvas;
            })(),

            monitorRunDependencies: function(remaining) {
                if (remaining === 0) {
                    overlay.classList.add('fade-out');
                    setTimeout(() => overlay.style.display = 'none', 500);
                    // 加载完成后尝试请求全屏（需要用户手势后才能成功）
                    requestFullscreen();
                } else {
                    const percent = Math.max(0, Math.min(100, (1 - remaining / 3) * 100));
                    progressFill.style.width = percent + '%';
                }
            },

            canvasResizeBehavior: 0, 
        };

        // === 【关键修复】全屏 API 请求 ===
        // 在用户交互后尝试进入全屏，隐藏浏览器地址栏
        function requestFullscreen() {
            var elem = document.documentElement;
            try {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) { // Safari / iOS
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) { // IE11
                    elem.msRequestFullscreen();
                }
            } catch(e) {
                console.log('[PWA] Fullscreen request failed:', e);
            }
        }

        // 在用户首次触摸/点击时请求全屏（浏览器要求必须有用户手势）
        var fullscreenRequested = false;
        function tryFullscreenOnInteraction() {
            if (!fullscreenRequested) {
                fullscreenRequested = true;
                requestFullscreen();
                // 移除监听器
                document.removeEventListener('touchstart', tryFullscreenOnInteraction, {passive: true});
                document.removeEventListener('mousedown', tryFullscreenOnInteraction, {passive: true});
            }
        }
        document.addEventListener('touchstart', tryFullscreenOnInteraction, {passive: true});
        document.addEventListener('mousedown', tryFullscreenOnInteraction, {passive: true});

        // === 【关键修复】零延迟触摸处理 ===
        // 使用 passive: false 的 touchstart/touchmove/touchend 监听器
        // 对 canvas 上的触摸事件立即 preventDefault，阻止浏览器猜测用户意图
        // 这样浏览器不会等待 300ms 来判断是 tap 还是 scroll
        
        // 记录触摸状态
        var touchTargets = new Map(); // 记录每个触摸点的起始位置
        
        canvas.addEventListener('touchstart', function(e) {
            // 记录每个触摸点的起始位置
            for (var i = 0; i < e.changedTouches.length; i++) {
                var touch = e.changedTouches[i];
                touchTargets.set(touch.identifier, {
                    startX: touch.clientX,
                    startY: touch.clientY,
                    startTime: Date.now()
                });
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', function(e) {
            // 如果触摸点在 canvas 上移动超过 10px，认为是拖拽而非点击
            // 这种情况下 preventDefault 阻止页面滚动
            for (var i = 0; i < e.changedTouches.length; i++) {
                var touch = e.changedTouches[i];
                var info = touchTargets.get(touch.identifier);
                if (info) {
                    var dx = touch.clientX - info.startX;
                    var dy = touch.clientY - info.startY;
                    var distance = Math.sqrt(dx*dx + dy*dy);
                    if (distance > 10) {
                        e.preventDefault(); // 阻止页面滚动
                    }
                }
            }
        }, { passive: false });

        canvas.addEventListener('touchend', function(e) {
            // 清除触摸记录
            for (var i = 0; i < e.changedTouches.length; i++) {
                var touch = e.changedTouches[i];
                touchTargets.delete(touch.identifier);
            }
        }, { passive: false });

        canvas.addEventListener('touchcancel', function(e) {
            // 清除所有触摸记录
            touchTargets.clear();
        }, { passive: false });

        // 初始化 Canvas 内部尺寸
        Module.canvas.width = GAME_WIDTH;
        Module.canvas.height = GAME_HEIGHT;

        /**
         * 【关键修复】用 JS 动态计算 canvas 显示尺寸，维持 16:9 宽高比
         * 替代 CSS 的 object-fit: contain + transform: translateZ(0)
         * 这样不会触发 GPU 合成层，避免 WebGL 条纹
         */
        function resizeCanvas() {
            const canvas = Module.canvas;
            const containerWidth = window.innerWidth;
            const containerHeight = window.innerHeight;
            const aspect = GAME_WIDTH / GAME_HEIGHT; // 16:9 = 1.777...

            let displayWidth, displayHeight;

            if (containerWidth / containerHeight > aspect) {
                // 容器更宽 → 以高度为基准
                displayHeight = containerHeight;
                displayWidth = Math.floor(displayHeight * aspect);
            } else {
                // 容器更高 → 以宽度为基准
                displayWidth = containerWidth;
                displayHeight = Math.floor(displayWidth / aspect);
            }

            // 设置 CSS 显示尺寸（不触发合成层）
            canvas.style.width = displayWidth + 'px';
            canvas.style.height = displayHeight + 'px';
        }

        // 页面加载和窗口大小变化时重新计算
        window.addEventListener('load', resizeCanvas);
        window.addEventListener('resize', resizeCanvas);
        // 某些浏览器在 orientationchange 时不会触发 resize
        window.addEventListener('orientationchange', resizeCanvas);

        // === App 可见性管理：后台暂停音频 ===
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                console.log('[PWA] App went to background, pausing audio');
                if (currentAudioContext && currentAudioContext.state !== 'closed') {
                    currentAudioContext.suspend();
                }
            } else {
                console.log('[PWA] App came to foreground, resuming audio');
                if (currentAudioContext && currentAudioContext.state === 'suspended') {
                    currentAudioContext.resume();
                }
            }
        });

        window.addEventListener('pagehide', function() {
            console.log('[PWA] pagehide event');
            if (currentAudioContext && currentAudioContext.state !== 'closed') {
                currentAudioContext.suspend();
            }
        });

        window.addEventListener('resume', function() {
            console.log('[PWA] resume event');
            if (currentAudioContext && currentAudioContext.state === 'suspended') {
                currentAudioContext.resume();
            }
        });

        // 全局错误捕获
        window.onerror = function(e) { console.error('Game Exception: ', e); };
    </script>
    
    <!-- 异步加载 Emscripten 胶水代码 -->
    <script async src="https://cdn.jsdelivr.net/gh/Std-Git/SunnyLand@master/SunnyLand-Emscripten.js"></script>

    <!-- PWA 安装引导逻辑 -->
    <script>
        let deferredPrompt = null;
        const installOverlay = document.getElementById('pwa-install-overlay');
        const installBtn = document.getElementById('pwa-install-btn');
        const dismissBtn = document.getElementById('pwa-dismiss-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            // 不阻止默认行为，让浏览器显示原生安装提示
            deferredPrompt = e;
            
            const dismissed = localStorage.getItem('pwa-dismissed');
            if (dismissed && (Date.now() - parseInt(dismissed)) < 7 * 24 * 60 * 60 * 1000) {
                return;
            }
            // 只在浏览器不支持原生提示时才显示自定义弹窗
            installOverlay.style.display = 'flex';
        });

        installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            // 先尝试调用浏览器原生安装提示
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            console.log('用户选择: ' + outcome);
            installOverlay.style.display = 'none';
            deferredPrompt = null;
        });

        dismissBtn.addEventListener('click', () => {
            installOverlay.style.display = 'none';
            deferredPrompt = null;
            localStorage.setItem('pwa-dismissed', Date.now().toString());
        });

        window.addEventListener('appinstalled', () => {
            installOverlay.style.display = 'none';
            deferredPrompt = null;
            console.log('PWA 安装成功！');
        });
    </script>
</body>
</html>
