<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    
    <!-- 1. 彻底禁止浏览器缩放、双击放大、iOS 安全区适配 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <title>SunnyLand</title>
    
    <!-- 2. PWA 核心配置 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    
    <!-- 3. iOS PWA 专属支持 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SunnyLand">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <style>
        /* 全局重置 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #000;
            display: flex; justify-content: center; align-items: center;
            
            /* 4. 核心触摸防护 */
            touch-action: none;             /* 禁用所有原生手势（平移、缩放、双击） */
            -webkit-touch-callout: none;    /* 禁用 iOS 长按弹出菜单 */
            -webkit-user-select: none;      /* 禁用文本选择 */
            user-select: none;
            overscroll-behavior: none;      /* 禁用 iOS/Android 橡皮筋回弹 */
        }

        /* Canvas 样式 */
        canvas.emscripten {
            display: block;
            width: 100vw; height: 100vh;
            object-fit: contain;            /* 保持 16:9 比例，黑边填充 */
            background: #000;
            image-rendering: pixelated;     /* 像素风核心：最近邻缩放，不模糊 */
            image-rendering: crisp-edges;   /* Firefox 兼容 */
            touch-action: none;             /* Canvas 自身也需声明 */
            
            /* 5. 消除点击高亮与强制硬件加速 */
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
            transform: translateZ(0); 
            will-change: transform; 
        }

        /* 6. 加载遮罩层样式 */
        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .loading-text {
            color: #fff; font-family: 'Courier New', monospace; font-size: 14px; 
            margin-bottom: 12px; opacity: 0.8; letter-spacing: 1px;
        }
        .progress-bar-container {
            width: 200px; height: 4px;
            background: #333; border-radius: 2px; overflow: hidden;
        }
        .progress-bar-fill {
            width: 0%; height: 100%;
            background: #fff;
            transition: width 0.2s ease;
        }
        .fade-out { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

    <!-- 加载遮罩 -->
    <div id="loading-overlay">
        <div class="loading-text">LOADING ASSETS...</div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
    </div>

    <!-- 游戏画布 -->
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()"></canvas>

    <!-- 7. PWA 安装引导弹窗 (Android 专属) -->
    <div id="pwa-install-overlay" style="
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.85); z-index: 10000;
        justify-content: center; align-items: center; flex-direction: column;
        backdrop-filter: blur(4px);
    ">
        <div style="
            background: #222; border: 2px solid #fff; border-radius: 12px;
            padding: 30px; max-width: 320px; text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        ">
            <div style="font-size: 40px; margin-bottom: 15px;">🎮</div>
            <h2 style="color: #fff; font-family: sans-serif; margin: 0 0 10px; font-size: 20px;">
                安装 SunnyLand
            </h2>
            <p style="color: #aaa; font-family: sans-serif; font-size: 14px; margin: 0 0 25px; line-height: 1.5;">
                添加到桌面，获得原生 App 般的流畅体验，<br>告别浏览器手势卡顿！
            </p>
            <button id="pwa-install-btn" style="
                width: 100%; padding: 14px; border: none; border-radius: 8px;
                background: #fff; color: #000; font-size: 16px; font-weight: bold;
                cursor: pointer; margin-bottom: 10px; transition: transform 0.1s;
            " onmousedown="this.style.transform='scale(0.95)'" onmouseup="this.style.transform='scale(1)'">
                立即安装
            </button>
            <button id="pwa-dismiss-btn" style="
                width: 100%; padding: 10px; border: none; border-radius: 8px;
                background: transparent; color: #888; font-size: 14px; cursor: pointer;
            ">
                以后再说
            </button>
        </div>
    </div>

    <script>
        // 8. CDN 基础路径
        const CDN_BASE = 'https://cdn.jsdelivr.net/gh/Std-Git/SunnyLand@master/';
        
        // DOM 元素
        const overlay = document.getElementById('loading-overlay');
        const progressFill = document.getElementById('progress-fill');

        // 9. 游戏逻辑分辨率（GPU 实际渲染尺寸）
        const GAME_WIDTH = 640;
        const GAME_HEIGHT = 360;

        var Module = {
            preRun: [],
            postRun: [],
            
            // 告诉 Emscripten 去 CDN 找文件
            locateFile: function(filename) {
                return CDN_BASE + filename;
            },

            print: function(e) { 
                if (arguments.length > 1) e = Array.prototype.slice.call(arguments).join(" "); 
                console.log(e); 
            },
            printErr: function(e) { 
                if (arguments.length > 1) e = Array.prototype.slice.call(arguments).join(" "); 
                console.error(e); 
            },

            canvas: (function() {
                var canvas = document.getElementById('canvas');
                canvas.addEventListener('contextmenu', function(e) { e.preventDefault(); }, false);
                canvas.addEventListener('webglcontextlost', function(e) {
                    alert('WebGL context lost. Please reload.');
                    e.preventDefault();
                }, false);
                return canvas;
            })(),

            // 10. 进度监听
            monitorRunDependencies: function(remaining) {
                if (remaining === 0) {
                    overlay.classList.add('fade-out');
                    setTimeout(() => overlay.style.display = 'none', 500);
                } else {
                    const percent = Math.max(0, Math.min(100, (1 - remaining / 3) * 100));
                    progressFill.style.width = percent + '%';
                }
            },

            // 11. 禁止 Emscripten 自动拉伸 Canvas
            canvasResizeBehavior: 0, 
        };

        // 12. 初始化 Canvas 内部尺寸
        Module.canvas.width = GAME_WIDTH;
        Module.canvas.height = GAME_HEIGHT;

        // 13. JS 兜底：拦截顽固的触摸事件
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (e) {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) { e.preventDefault(); }
            lastTouchEnd = now;
        }, { passive: false });

        document.addEventListener('touchstart', function (e) {
            if (e.touches.length > 1) { e.preventDefault(); }
        }, { passive: false });

        document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });

        // 全局错误捕获
        window.onerror = function(e) { console.error('Game Exception: ', e); };
    </script>
    
    <!-- 14. 异步加载 Emscripten 胶水代码 -->
    <script async src="https://cdn.jsdelivr.net/gh/Std-Git/SunnyLand@master/SunnyLand-Emscripten.js"></script>

    <!-- 15. PWA 安装引导逻辑 -->
    <script>
        let deferredPrompt = null;
        const installOverlay = document.getElementById('pwa-install-overlay');
        const installBtn = document.getElementById('pwa-install-btn');
        const dismissBtn = document.getElementById('pwa-dismiss-btn');

        // 监听安装提示事件
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            
            // 如果用户7天内点过“以后再说”，就不弹窗
            const dismissed = localStorage.getItem('pwa-dismissed');
            if (dismissed && (Date.now() - parseInt(dismissed)) < 7 * 24 * 60 * 60 * 1000) {
                return;
            }
            installOverlay.style.display = 'flex';
        });

        // 点击“立即安装”
        installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            console.log(`用户选择: ${outcome}`);
            installOverlay.style.display = 'none';
            deferredPrompt = null;
        });

        // 点击“以后再说”
        dismissBtn.addEventListener('click', () => {
            installOverlay.style.display = 'none';
            deferredPrompt = null;
            localStorage.setItem('pwa-dismissed', Date.now().toString());
        });

        // 安装成功后自动关闭弹窗
        window.addEventListener('appinstalled', () => {
            installOverlay.style.display = 'none';
            deferredPrompt = null;
            console.log('PWA 安装成功！');
        });
    </script>
</body>
</html>
